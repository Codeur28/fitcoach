<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitCoach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FitCoach</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;--txt:#eef1f5;--mut:#9aa3b2;
  --acc:#b6f23a;--acc-ink:#15200a;--acc2:#ff8a3d;--blue:#5cc8ff;--danger:#ff5d5d;
  --fig:#e8ecf2;--fig-far:#6c7484;--r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);padding:calc(10px + var(--safe-t)) 0 10px;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.logo svg{width:24px;height:24px}
header.top h1{font-size:19px;letter-spacing:-.2px}
header.top small{color:var(--mut);display:block;font-size:12px;font-weight:400}
section.tab{display:none;padding:16px 0 24px}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:15px}
.mut{color:var(--mut)}
.small{font-size:13px}
label.f{display:block;margin:12px 0 6px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=number],input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
input:focus{border-color:var(--acc)}
.unit{position:relative}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.goal b{display:block;font-size:15px}.goal span{font-size:12px;color:var(--mut)}
.goal .ic{font-size:22px;display:block;margin-bottom:4px}
.goal.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:1px 0 0;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat b{font-size:22px;display:block;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:0 4px 4px 0}
.pill.acc{background:rgba(182,242,58,.12);border-color:rgba(182,242,58,.4);color:var(--acc)}
.pill.l1{color:#7ee787;border-color:#2e5d38}.pill.l2{color:#ffc65c;border-color:#6b5320}.pill.l3{color:#ff7b72;border-color:#6e2a27}
.week{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:18px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{text-align:center;border-radius:10px;padding:8px 0;background:var(--card2);font-size:12px;color:var(--mut)}
.day b{display:block;font-size:14px;color:var(--txt)}
.day.on{background:var(--acc);color:var(--acc-ink)}.day.on b{color:var(--acc-ink)}
.sess-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.exi{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.exi:first-of-type{border-top:0}
.thumb{width:64px;height:58px;flex:none;background:var(--card2);border-radius:10px;overflow:hidden}
.exi .t{flex:1;min-width:0}
.exi .t b{display:block;font-size:15px}
.exi .t span{font-size:13px;color:var(--mut)}
.dose{font-weight:700;color:var(--acc);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.excard .fbox{background:var(--card2);aspect-ratio:1.15}
.excard .in{padding:8px 10px 10px}
.excard b{display:block;font-size:14px;line-height:1.25}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
svg.fig{width:100%;height:100%;display:block}
svg.fig .limb,svg.fig .torso{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.fig .limb{stroke-width:9}
svg.fig .near{stroke:var(--fig)}
svg.fig .far{stroke:var(--fig-far)}
svg.fig .torso{stroke:var(--fig);stroke-width:13}
svg.fig .head{fill:var(--fig)}
svg.fig .near.hl,svg.fig .torso.hl{stroke:var(--acc)}
svg.fig .far.hl{stroke:#6f9426}
svg.fig .ground{stroke:var(--line);stroke-width:2}
svg.fig .shadow{fill:#000;opacity:.25}
svg.fig .prop{fill:#2c323e;stroke:#3a4150;stroke-width:2}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,23,29,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bot .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
svg.plate{width:100%;height:100%;display:block}
.thumb svg.plate{object-fit:cover}
nav.bot button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer}
nav.bot button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bot button.on{color:var(--acc)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + var(--safe-b));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .bigfig{background:var(--card2);border-radius:16px;aspect-ratio:1.2;margin:10px 0}
.sheet ul{padding-left:20px;margin:6px 0 12px}.sheet li{margin:4px 0}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);font-size:18px;cursor:pointer;flex:none}
.ctrls{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.warn{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.35);color:#ffc29a;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
/* Runner */
#run{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#run.on{display:flex}
#run .rtop{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 8px}
#run .prog{height:5px;background:var(--card2);border-radius:9px;flex:1;overflow:hidden}
#run .prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
#run .rbody{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:0 16px calc(16px + var(--safe-b));min-height:0}
#run .rfig{flex:1;min-height:150px;background:var(--card);border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#run .rfig .fig{max-height:100%}
#run .phase{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);margin-top:14px}
#run h2{font-size:24px;margin:2px 0 4px}
#run .target{font-size:56px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
#run .target small{font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
#run .cue{color:var(--mut);font-size:14px;min-height:20px}
#run .ract{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:14px}
#run.rest .rfig{background:linear-gradient(160deg,#1b2a10,#14171d)}
#run .restbig{font-size:96px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
#run .nextbox{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-top:12px}
#run .nextbox .thumb{width:58px;height:52px}
.done-ic{font-size:64px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist:first-child{border-top:0}
.install ol{padding-left:20px;margin:6px 0}.install li{margin:4px 0}

/* ===== Thème coloré ===== */
:root{--c-lime:#b6f23a;--c-mint:#3ee0a8;--c-orange:#ff8a3d;--c-blue:#5cc8ff;--c-pink:#ff6bb5;--c-violet:#a78bfa;--c-yellow:#ffd166;
  --grad:linear-gradient(135deg,#c9f94e 0%,#3ee0a8 100%);--card:#171b24;--card2:#1f2430;--line:#2a3040}
body{background:
  radial-gradient(600px 400px at 110% -5%,rgba(167,139,250,.22),transparent 60%),
  radial-gradient(500px 380px at -15% 30%,rgba(62,224,168,.14),transparent 60%),
  radial-gradient(600px 420px at 120% 85%,rgba(255,107,181,.13),transparent 60%),
  var(--bg);background-attachment:fixed}
header.top{background:rgba(15,17,23,.75)}
.logo{background:var(--grad);box-shadow:0 4px 16px rgba(62,224,168,.35)}
header.top h1{background:linear-gradient(90deg,#fff 30%,#b6f23a 70%,#3ee0a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(180deg,rgba(32,37,50,.9),rgba(22,25,34,.92));border-color:rgba(255,255,255,.07);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn.pri{background:var(--grad);border:0;color:#0d1a10;box-shadow:0 6px 18px rgba(62,224,168,.3)}
.btn.pri:active{transform:scale(.98)}
.seg button.on{background:var(--grad);color:#0d1a10;box-shadow:0 3px 10px rgba(62,224,168,.3)}
/* objectifs */
.goal{--c:var(--c-lime);transition:.15s}
.goal[data-v=perte]{--c:var(--c-orange)}.goal[data-v=muscle]{--c:var(--c-violet)}.goal[data-v=force]{--c:var(--c-pink)}.goal[data-v=endurance]{--c:var(--c-blue)}
.goal .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.goal.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 6px 18px color-mix(in srgb,var(--c) 25%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--card2)),var(--card2))}
.goal.on b{color:var(--c)}
/* tuiles de stats */
.stat{--c:var(--c-lime);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 20%,var(--card2)),var(--card2) 70%);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.stat b{color:var(--c)}
.stat:nth-child(6n+2){--c:var(--c-orange)}.stat:nth-child(6n+3){--c:var(--c-blue)}.stat:nth-child(6n+4){--c:var(--c-pink)}.stat:nth-child(6n+5){--c:var(--c-violet)}.stat:nth-child(6n){--c:var(--c-yellow)}
/* navigation */
nav.bot{background:rgba(17,20,27,.9)}
nav.bot button.on{color:var(--c-mint)}
nav.bot button.on svg{background:rgba(62,224,168,.16);border-radius:10px;padding:3px 10px;width:44px;height:30px}
nav.bot button svg{padding:3px 10px;width:44px;height:30px;transition:.2s}
/* puces */
.chips button.on{background:var(--grad);color:#0d1a10;border-color:transparent}
#exCat button[data-c="Jambes"].on{background:var(--c-violet)}#exCat button[data-c="Haut du corps"].on{background:var(--c-orange)}
#exCat button[data-c="Abdos & gainage"].on{background:var(--c-blue)}#exCat button[data-c="Cardio"].on{background:var(--c-pink)}
[data-diet=equilibre].on{background:var(--c-mint)!important}[data-diet=medit].on{background:var(--c-yellow)!important}[data-diet=proteine].on{background:var(--c-violet)!important}
[data-diet=vege].on{background:var(--c-lime)!important}[data-diet=vegan].on{background:#5ee07a!important}[data-diet=keto].on{background:var(--c-orange)!important}[data-diet=sansgluten].on{background:var(--c-blue)!important}
/* figures colorées par catégorie */
svg.fig .near.hl,svg.fig .torso.hl{stroke:var(--hl,var(--acc))}
svg.fig .far.hl{stroke:color-mix(in srgb,var(--hl,var(--acc)) 55%,#1a1d24)}
svg.fig .head{fill:#fff}
.excard{border-color:rgba(255,255,255,.07);transition:transform .15s}
.excard:active{transform:scale(.97)}
.thumb,.excard .fbox{background:#141821}
/* séances */
.card.sess{border-left:4px solid var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 45%),linear-gradient(180deg,rgba(32,37,50,.9),rgba(22,25,34,.92))}
.card.sess h2{color:var(--c)}
.card.sess .btn.pri{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 35%,transparent)}
.day.on{background:var(--c,var(--c-lime));box-shadow:0 4px 12px color-mix(in srgb,var(--c,var(--c-lime)) 35%,transparent)}
.dose{color:var(--c,var(--c-lime))}
.week button{background:var(--card2)}
/* séance guidée */
#run{background:radial-gradient(500px 400px at 50% 0%,color-mix(in srgb,var(--rc,#3ee0a8) 22%,transparent),transparent 70%),var(--bg)}
#run .rfig{background:radial-gradient(circle at 50% 75%,color-mix(in srgb,var(--rc,#3ee0a8) 22%,#171b24),#141821 75%)}
#run .phase{color:var(--rc,var(--c-mint))}
#run .target{background:linear-gradient(90deg,#fff,var(--rc,#3ee0a8));-webkit-background-clip:text;background-clip:text;color:transparent}
#run .target small{-webkit-text-fill-color:var(--mut)}
#run .prog i{background:var(--grad)}
#run.rest .rfig{background:radial-gradient(circle at 50% 45%,rgba(62,224,168,.28),#141821 70%)}
#run .restbig{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill.acc{background:rgba(62,224,168,.12);border-color:rgba(62,224,168,.45);color:var(--c-mint)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#15200a" stroke-width="2.6" stroke-linecap="round"><circle cx="14" cy="4.5" r="2.2" fill="#15200a" stroke="none"/><path d="M13 8l-3 6 4 3-1 5M10 14l-4 1M13 8l5 2 2-3"/></svg></div>
  <div><h1 id="hdTitle">FitCoach</h1><small id="hdSub">Ton coach sport à la maison</small></div>
</div></header>

<noscript><div class="wrap"><div class="warn" style="margin-top:14px;font-size:14px">⚠️ <b>Cet aperçu n'exécute pas le JavaScript</b> : les onglets et les boutons ne peuvent pas fonctionner ici. Ouvre FitCoach dans un vrai navigateur (Chrome, Edge, Safari) ou à l'adresse http://localhost:8765.</div></div></noscript>
<main class="wrap">
<!-- PROFIL -->
<section class="tab on" id="t-profil">
  <div class="card">
    <h2>Mon profil</h2>
    <p class="mut small" style="margin:0">Renseigne tes infos : ton programme, tes temps de repos et tes répétitions sont calculés pour toi.</p>
    <label class="f">Sexe</label>
    <div class="seg" id="sexe"><button data-v="H">Homme</button><button data-v="F">Femme</button></div>
    <div class="row">
      <div><label class="f">Âge</label><div class="unit"><input type="number" id="age" inputmode="numeric" min="12" max="90" placeholder="25"><span>ans</span></div></div>
      <div><label class="f">Poids</label><div class="unit"><input type="number" id="poids" inputmode="decimal" min="30" max="250" placeholder="70"><span>kg</span></div></div>
      <div><label class="f">Taille</label><div class="unit"><input type="number" id="taille" inputmode="numeric" min="120" max="230" placeholder="175"><span>cm</span></div></div>
    </div>
    <label class="f">Niveau</label>
    <div class="seg" id="niveau"><button data-v="1">Débutant</button><button data-v="2">Intermédiaire</button><button data-v="3">Avancé</button></div>
    <p class="mut small" id="nivHelp" style="margin:6px 2px 0"></p>
    <label class="f">Objectifs <span style="text-transform:none;font-weight:500;letter-spacing:0">(plusieurs choix possibles)</span></label>
    <div class="goals" id="objectif">
      <button class="goal" data-v="perte"><span class="ic">🔥</span><b>Perdre du poids</b><span>Circuits, brûler des calories</span></button>
      <button class="goal" data-v="muscle"><span class="ic">💪</span><b>Prendre du muscle</b><span>Volume, tempo contrôlé</span></button>
      <button class="goal" data-v="force"><span class="ic">🏋️</span><b>Gagner en force</b><span>Variantes dures, longs repos</span></button>
      <button class="goal" data-v="endurance"><span class="ic">🫀</span><b>Endurance / forme</b><span>Fractionné, cardio</span></button>
    </div>
    <p class="mut small" id="goalHelp" style="margin:8px 2px 0"></p>
    <label class="f">Séances par semaine</label>
    <div class="seg" id="jours"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button></div>
    <label class="chk"><input type="checkbox" id="noJump"><span>Éviter les sauts <span class="mut">(genoux sensibles, voisins…)</span></span></label>
    <label class="chk"><input type="checkbox" id="chair" checked><span>J'ai une chaise stable <span class="mut">(pour les dips)</span></span></label>
    <div style="margin-top:16px"><button class="btn pri full" id="btnGen">Générer mon programme</button></div>
    <p class="mut small" id="formErr" style="color:var(--danger);display:none;margin:8px 0 0"></p>
  </div>
  <div class="card" id="bilan" style="display:none"></div>
</section>

<!-- PROGRAMME -->
<section class="tab" id="t-prog"></section>

<!-- EXERCICES -->
<section class="tab" id="t-ex">
  <div class="chips" id="exCat"></div>
  <div class="chips" id="exLvl"></div>
  <div class="grid" id="exGrid"></div>
</section>

<!-- SUIVI -->
<!-- NUTRITION -->
<section class="tab" id="t-nutri"></section>

<!-- SUIVI -->
<section class="tab" id="t-suivi"></section>
</main>

/* ============================================================
   1. MOTEUR D'ANIMATION (personnage articulé + cinématique inverse)
   ============================================================ */
const L={ua:30,fa:28,th:38,sh:38,neck:16};
const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
const ease=u=>.5-.5*Math.cos(Math.PI*u);
// Cinématique inverse à 2 segments : renvoie [articulation, extrémité]
function ik(a,t,l1,l2,s){
  const dx=t[0]-a[0],dy=t[1]-a[1],d=Math.hypot(dx,dy),max=l1+l2-.01,min=Math.abs(l1-l2)+.01;
  const dd=Math.min(max,Math.max(min,d)),base=Math.atan2(dy,dx);
  const c=(l1*l1+dd*dd-l2*l2)/(2*l1*dd),al=Math.acos(Math.max(-1,Math.min(1,c))),ang=base+s*al;
  const j=[a[0]+l1*Math.cos(ang),a[1]+l1*Math.sin(ang)];
  const e=d>max?[a[0]+(l1+l2)*Math.cos(base),a[1]+(l1+l2)*Math.sin(base)]:t;
  return [j,e];
}
function resolveKey(p,ex){
  const head=p.head||(()=>{const dx=p.sh[0]-p.hip[0],dy=p.sh[1]-p.hip[1],d=Math.hypot(dx,dy)||1;return[p.sh[0]+dx/d*L.neck,p.sh[1]+dy/d*L.neck]})();
  const k={hip:p.hip,sh:p.sh,head,hands:p.hands,feet:p.feet,el:[],kn:[],elX:[],knX:[]};
  for(let i=0;i<2;i++){
    const e=p.el&&p.el[i],n=p.kn&&p.kn[i];
    k.elX[i]=!!e;k.el[i]=e||ik(p.sh,p.hands[i],L.ua,L.fa,ex.eb[i])[0];
    k.knX[i]=!!n;k.kn[i]=n||ik(p.hip,p.feet[i],L.th,L.sh,ex.kb[i])[0];
  }
  return k;
}
function poseBetween(ex,A,B,u){
  const hip=lerp(A.hip,B.hip,u),sh=lerp(A.sh,B.sh,u),o={hip,sh,head:lerp(A.head,B.head,u),el:[],hd:[],kn:[],ft:[]};
  for(let i=0;i<2;i++){
    const hand=lerp(A.hands[i],B.hands[i],u),foot=lerp(A.feet[i],B.feet[i],u);
    if(A.elX[i]||B.elX[i]){o.el[i]=lerp(A.el[i],B.el[i],u);o.hd[i]=hand}
    else{const r=ik(sh,hand,L.ua,L.fa,ex.eb[i]);o.el[i]=r[0];o.hd[i]=r[1]}
    if(A.knX[i]||B.knX[i]){o.kn[i]=lerp(A.kn[i],B.kn[i],u);o.ft[i]=foot}
    else{const r=ik(hip,foot,L.th,L.sh,ex.kb[i]);o.kn[i]=r[0];o.ft[i]=r[1]}
  }
  return o;
}

  <polyline class="limb near${hl('legs')}"/><polyline class="limb near${hl('arms')}"/>`;
  const [armF,legF,torso,head,legN,armN]=[...svg.children].slice(-6);
  const f={ex,svg,parts:{armF,legF,torso,head,legN,armN},t:opt.t||0,speed:1,paused:false,visible:true,last:0};
  if(!ex._keys){ex._keys=ex.frames.map(p=>resolveKey(p,ex));ex._segs=ex.frames.map(p=>({h:p.h??ex.hold??0,d:p.d||ex.dur||900}));ex._tot=ex._segs.reduce((s,x)=>s+x.h+x.d,0)}
  drawFig(f);figs.add(f);
  if(io){f.visible=false;io.observe(svg)}

  svg.style.background=`radial-gradient(circle at 50% 78%, ${CATCOL[ex.cat]}38, transparent 68%)`;
  return f;
}
const P=a=>a[0].toFixed(1)+','+a[1].toFixed(1);
function drawFig(f){
  const ex=f.ex,K=ex._keys,S=ex._segs;let t=f.t%ex._tot,i=0;
  while(t>S[i].h+S[i].d){t-=S[i].h+S[i].d;i++}
  const A=K[i],B=K[(i+1)%K.length],u=t<=S[i].h?0:ease((t-S[i].h)/S[i].d);
  const o=poseBetween(ex,A,B,u),p=f.parts;
  p.armN.setAttribute('points',P(o.sh)+' '+P(o.el[0])+' '+P(o.hd[0]));
  p.armF.setAttribute('points',P(o.sh)+' '+P(o.el[1])+' '+P(o.hd[1]));
  p.legN.setAttribute('points',P(o.hip)+' '+P(o.kn[0])+' '+P(o.ft[0]));
  p.legF.setAttribute('points',P(o.hip)+' '+P(o.kn[1])+' '+P(o.ft[1]));
  p.torso.setAttribute('points',P(o.hip)+' '+P(o.sh)+' '+P(lerp(o.sh,o.head,.5)));
  p.head.setAttribute('cx',o.head[0].toFixed(1));p.head.setAttribute('cy',o.head[1].toFixed(1));
}
function loop(now){
  for(const f of figs){
    if(!f.svg.isConnected){figs.delete(f);continue}
    const dt=f.last?Math.min(100,now-f.last):0;f.last=now;
    if(f.paused||!f.visible)continue;
    f.t+=dt*f.speed;drawFig(f);
  }
  requestAnimationFrame(loop);
}

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;

function comboTxt(p){const k=goalsKey(p);return goalsOf(p).length<2?'':COMBOS[k]||"Programme hybride qui combine tous tes objectifs : musculation, cardio et léger ajustement des calories."}
const GOALS={perte:'Perdre du poids',muscle:'Prendre du muscle',force:'Gagner en force',endurance:'Endurance / forme'};
const NIVHELP={1:"Moins de 6 mois de pratique, moins de 10 pompes d'affilée.",2:"Entraînement régulier, 10 à 25 pompes d'affilée.",3:"Plus de 2 ans de pratique, plus de 25 pompes d'affilée."};

function bilan(p){
  const m=p.taille/100,imc=p.poids/(m*m);
  const imcCat=imc<18.5?'Maigreur':imc<25?'Corpulence normale':imc<30?'Surpoids':'Obésité';
  const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==='H'?5:-161);
  const fact={2:1.375,3:1.45,4:1.55,5:1.65,6:1.725}[p.jours];
  const tdee=bmr*fact;
  const gs=goalsOf(p);
  const mult=avg(gs.map(g=>({perte:.8,muscle:1.1,force:1.05,endurance:1})[g]));
  let kcal=tdee*mult;if(gs.includes('perte'))kcal=Math.max(kcal,p.sexe==='H'?1500:1200,bmr);
  const prot=Math.round(p.poids*Math.max(...gs.map(g=>({perte:1.8,muscle:1.8,force:1.7,endurance:1.4})[g])));
  const eau=(p.poids*.035+.5).toFixed(1);
  const fcmax=Math.round(208-.7*p.age);
  const Z={perte:[.6,.7],muscle:[.6,.7],force:[.6,.7],endurance:[.7,.85]},zone=[avg(gs.map(g=>Z[g][0])),avg(gs.map(g=>Z[g][1]))];
  const low=p.noJump||p.age>=55||imc>=30;
  return{imc,imcCat,bmr,tdee,kcal:Math.round(kcal/10)*10,prot,eau,fcmax,zone,low};
}

// Paramètres d'entraînement selon l'objectif (index = niveau 1..3)
const GP={
  perte:    {mode:'circuit',sets:[0,2,3,4],reps:[0,[12,15],[15,20],[15,20]],time:[0,30,40,45],rest:[0,30,25,20],round:[0,90,75,60],tempo:'Rythme soutenu mais contrôlé',fmt:'Circuit : enchaîne les exercices, repos entre les tours',sec:3},
  muscle:   {mode:'series',sets:[0,3,4,4],reps:[0,[8,12],[10,12],[8,12]],time:[0,30,40,50],rest:[0,75,75,90],tempo:'3-1-1 (3 s en descente, 1 s pause, 1 s en montée)',fmt:'Séries classiques, tempo lent pour plus de tension',sec:5},
  force:    {mode:'series',sets:[0,3,4,5],reps:[0,[8,10],[6,8],[4,6]],time:[0,25,40,60],rest:[0,120,150,180],tempo:'2-1-X (descente contrôlée, montée explosive)',fmt:'Peu de répétitions, variantes difficiles, longs repos',sec:4},
  endurance:{mode:'circuit',sets:[0,2,3,4],reps:null,time:[0,30,40,45],rest:[0,30,20,15],round:[0,90,75,60],tempo:'Rythme régulier, sans t’arrêter',fmt:'Fractionné : effort chronométré / récupération courte',sec:3}
};
const PHASES=[null,
  {n:'Adaptation',d:'Apprends les mouvements, technique avant tout.',reps:0,sets:0},
  {n:'Adaptation',d:'Même programme : vise le haut de la fourchette.',reps:0,sets:0},
  {n:'Progression',d:'+2 répétitions (ou +5 s) par série.',reps:2,sets:0},
  {n:'Progression',d:'+2 répétitions (ou +5 s) par série.',reps:2,sets:0},
  {n:'Intensification',d:'+1 série sur chaque exercice.',reps:2,sets:1},
  {n:'Intensification',d:'+1 série sur chaque exercice.',reps:2,sets:1},
  {n:'Pic',d:'Semaine la plus dure : donne tout, technique propre.',reps:3,sets:1},
  {n:'Récupération',d:'Volume réduit pour laisser le corps assimiler. Ensuite, refais un cycle ou passe au niveau supérieur.',reps:0,sets:-1}
];
const STRENGTH=g=>g==='muscle'||g==='force';
function gp(p){
  const gs=goalsOf(p);if(gs.length===1)return GP[gs[0]];
  const G=gs.map(g=>GP[g]),mode=gs.some(STRENGTH)?'series':'circuit',lv=[0,1,2,3],RG=G.filter(g=>g.reps);
  const lead=G.find(g=>g.mode===mode);
  return{mode,
    sets:lv.map(l=>Math.round(avg(G.map(g=>g.sets[l])))),
    reps:RG.length?lv.map(l=>l?[Math.round(avg(RG.map(g=>g.reps[l][0]))),Math.round(avg(RG.map(g=>g.reps[l][1])))]:0):null,
    time:lv.map(l=>r5(avg(G.map(g=>g.time[l])))),
    rest:lv.map(l=>r5(avg(G.map(g=>g.rest[l])))),
    round:lv.map(l=>r5(avg(G.map(g=>(g.round||[0,90,75,60])[l])))),
    sec:Math.round(avg(G.map(g=>g.sec))),tempo:lead.tempo,
    fmt:mode==='series'?'Mixte : séries de musculation avec repos ajustés pour combiner tes objectifs':'Mixte : circuits rythmés, effort et récupération courte'};
}
function splitKey(p){const gs=goalsOf(p),s=gs.some(STRENGTH),d=gs.some(g=>!STRENGTH(g));return s&&d?'M':s?'S':'D'}
function patterns(goal){
  const S=STRENGTH(goal);
  return{
    squat:  [0,['squat'],S?['squat']:['squat_saute','squat'],S?['pistol','squat']:['squat_saute','squat']],
    lunge:  [0,['fente'],['fente'],S?['fente']:['fentes_sautees','fente']],
    glute:  [0,['pont'],['pont'],['pont']],
    legiso: [0,['chaise'],['chaise'],['chaise']],
    push:   [0,['pompes_genoux'],['pompes'],['pompes']],
    push2:  [0,['dips','pompes_genoux'],['dips','pike','pompes_genoux'],['pike','dips']],
    back:   [0,['superman'],['superman'],['superman']],
    core1:  [0,['planche'],['planche'],['hollow','planche']],
    core2:  [0,['crunch'],['releves','crunch'],['releves']],
    cardio: [0,['jumping_jacks','montees_genoux'],['burpees','jumping_jacks','montees_genoux'],['burpees','mountain']],
    cardio2:[0,['montees_genoux','jumping_jacks'],['mountain','montees_genoux'],['mountain','fentes_sautees','montees_genoux']]
  };
}
const TPL={
  A:{n:'Full body A',p:['squat','push','glute','core1','cardio']},
  B:{n:'Full body B',p:['lunge','push2','back','core2','cardio2']},
  H:{n:'Haut du corps',p:['push','push2','back','core1','core2']},
  J:{n:'Bas du corps',p:['squat','lunge','glute','legiso','core1']},
  C:{n:'Cardio + abdos',p:['cardio','core2','cardio2','core1','squat']},
  G:{n:'Gainage + posture',p:['core1','core2','back','glute','legiso']}
};
const SPLIT={
  S:{2:'AB',3:'ABA',4:'HJHJ',5:'HJGHJ',6:'HJGHJG'},
  D:{2:'AB',3:'ACB',4:'ACBC',5:'ACBCA',6:'ACBACB'},
  M:{2:'AB',3:'ABC',4:'HJAC',5:'HJCAB',6:'HJCHJC'}
};
const DAYIDX={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_FULL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const listFr=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' et '+a[a.length-1];
const r5=x=>Math.round(x/5)*5;

function pick(cands,used,p){
  let list=cands.map(id=>p.low&&LOW[id]?LOW[id]:id).filter(id=>(p.chair||EX[id].matos!=='Chaise'));
  let id=list.find(i=>!used.has(i));
  if(!id)id=['montees_genoux','planche','pont','squat','superman'].find(i=>!used.has(i));
  used.add(id);return id;
}
function dose(id,p,week){
  const ex=EX[id],g=gp(p),l=+p.niveau,ph=PHASES[week];
  let sets=Math.max(2,g.sets[l]+ph.sets);
  let rest=g.rest[l];
  if(p.age>=50)rest+=15;if(p.age>=60)rest+=15;
  const d={id,sets,rest:r5(rest),tempo:g.tempo,uni:ex.uni};
  if(ex.type==='time'||!g.reps){
    d.secs=Math.round((g.time[l]+ph.reps*2.5)/5)*5;
  }else{
    const f=ex.rf||1;
    d.reps=[Math.max(3,Math.round(g.reps[l][0]*f)+ph.reps),Math.max(4,Math.round(g.reps[l][1]*f)+ph.reps)];
  }
  return d;
}
function genProgram(p,week){
  p={...p,low:bilan(p).low};
  const key=splitKey(p),seq=SPLIT[key][p.jours].split('');
  const pats=patterns(goalsOf(p).some(STRENGTH)?'muscle':'perte'),g=gp(p),l=+p.niveau,ph=PHASES[week];
  const letters={};let ord=0;
  const sessions=seq.map((code,i)=>{
    const used=new Set();
    const items=TPL[code].p.map(pt=>dose(pick(pats[pt][l],used,p),p,week));
    if(!letters[code])letters[code]=++ord;
    const rounds=g.mode==='circuit'?Math.max(2,g.sets[l]+ph.sets):null;
    let sec=0;
    items.forEach(it=>{const work=it.secs||((it.reps[0]+it.reps[1])/2*g.sec*(it.uni?2:1));const n=g.mode==='circuit'?rounds:it.sets;sec+=n*(work+it.rest)});
    if(g.mode==='circuit')sec+=(rounds-1)*g.round[l];
    sec+=6*60+5*35;
    return{code,name:TPL[code].n,day:DAYIDX[p.jours][i],items,mode:g.mode,rounds,roundRest:g.round?g.round[l]:0,mins:Math.round(sec/60)};
  });
  return{sessions,phase:ph};
}
function doseTxt(d){
  if(d.secs)return`${d.sets} × ${d.secs} s`;
  return`${d.sets} × ${d.reps[0]}–${d.reps[1]}${d.uni?' /côté':''}`;
}

function wSpark(w){
  const pts=w.slice(-20),vs=pts.map(p=>p.v),mn=Math.min(...vs)-.5,mx=Math.max(...vs)+.5,W=300,H=70;
  const xy=pts.map((p,i)=>[i/(pts.length-1)*W,H-(p.v-mn)/(mx-mn)*H]);
  const diff=(vs[vs.length-1]-vs[0]).toFixed(1);
  return`<p class="small" style="margin:12px 0 4px"><b>Évolution :</b> <span class="mut">${diff>0?'+':''}${diff} kg sur ${pts.length} pesées</span></p>
  <svg viewBox="-4 -4 ${W+8} ${H+8}" style="width:100%;height:80px"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--acc)"/>`).join('')}</svg>`;
}

/* ============================================================
   5. SÉANCE GUIDÉE (chrono, repos, bips, vibrations)
   ============================================================ */
let R=null,actx=null,wake=null;
function beep(f=880,ms=140,v=.25){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+ms/1000);o.stop(actx.currentTime+ms/1000+.02)}catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function buildSteps(s){
  const st=[],low=profile&&bilan(profile).low;
  const W=[{id:low?'montees_genoux':'jumping_jacks',secs:45},{id:'squat',reps:[10,10]},{id:'montees_genoux',secs:30},{id:'pont',reps:[10,10]},{id:'planche',secs:20}];
  W.forEach((w,i)=>{st.push({k:'work',ph:'Échauffement',id:w.id,secs:w.secs,reps:w.reps,set:i+1,of:W.length,lbl:'Exercice'});st.push({k:'rest',secs:10})});
  if(s.mode==='circuit'){
    for(let r=1;r<=s.rounds;r++){
      s.items.forEach((it,i)=>{
        st.push({k:'work',ph:`Tour ${r} / ${s.rounds}`,id:it.id,secs:it.secs,reps:it.reps,uni:it.uni,set:i+1,of:s.items.length,lbl:'Exercice'});
        const last=i===s.items.length-1;
        if(!last)st.push({k:'rest',secs:it.rest});else if(r<s.rounds)st.push({k:'rest',secs:s.roundRest,big:1});
      });
    }
  }else{
    s.items.forEach((it,i)=>{for(let k=1;k<=it.sets;k++){
      st.push({k:'work',ph:`Exercice ${i+1} / ${s.items.length}`,id:it.id,secs:it.secs,reps:it.reps,uni:it.uni,set:k,of:it.sets,lbl:'Série',tempo:it.tempo});
      st.push({k:'rest',secs:it.rest});
    }});
  }
  STRETCH.forEach((x,i)=>{st.push({k:'stretch',n:x.n,t:x.t,secs:35,set:i+1,of:STRETCH.length})});
  st.unshift({k:'rest',secs:8,first:1});
  for(let i=0;i<st.length;i++)if(st[i].k==='rest')st[i].next=st.slice(i+1).find(x=>x.k!=='rest');
  return st;
}
async function startRun(s){
  R={s,steps:buildSteps(s),i:0,t0:Date.now(),timer:null,end:0,paused:0};
  $('#run').classList.add('on');document.body.style.overflow='hidden';
  try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}
  beep(660,80,.01);
  runStep();
}
function stopRun(save){
  clearInterval(R&&R.timer);clearInterval(R&&R.cue);
  if(save){const h=store.get('fc_hist',[]);h.push({d:Date.now(),n:`Séance ${R.s.code} · ${R.s.name}`,m:Math.max(1,Math.round((Date.now()-R.t0)/60000))});store.set('fc_hist',h)}
  R=null;$('#run').classList.remove('on','rest');$('#runBody').innerHTML='';document.body.style.overflow='';
  try{wake&&wake.release()}catch(e){}wake=null;
}
$('#runClose').onclick=()=>{if(!R)return;if(R.i>=R.steps.length||confirm('Quitter la séance ? Elle ne sera pas enregistrée.'))stopRun(false)};
function fmt(s){s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s)}
function runStep(){
  clearInterval(R.timer);
  const n=R.steps.length,run=$('#run'),body=$('#runBody');
  $('#runProg').style.width=(R.i/n*100)+'%';
  $('#runCount').textContent=Math.min(R.i+1,n)+'/'+n;
  if(R.i>=n){
    run.classList.remove('rest');
    const mins=Math.max(1,Math.round((Date.now()-R.t0)/60000));
    body.innerHTML=`<div class="rfig" style="flex-direction:column;gap:6px;text-align:center;padding:20px"><div class="done-ic">🏆</div><h2>Séance terminée !</h2><p class="mut">${R.s.name} · ${mins} min<br>Pense à boire et à manger des protéines dans les 2 h.</p></div>
      <button class="btn pri full" style="margin-top:14px" id="rSave">Enregistrer et terminer</button>`;
    beep(660,120);setTimeout(()=>beep(880,120),150);setTimeout(()=>beep(1100,250),300);buzz([100,60,100,60,300]);
    $('#rSave').onclick=()=>{stopRun(true);show('suivi')};return;
  }
  const st=R.steps[R.i];
  run.classList.toggle('rest',st.k==='rest');
  if(st.k==='rest'){
    const nx=st.next;
    body.innerHTML=`<div class="rfig" style="flex-direction:column"><div class="mut" style="font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:13px">${st.first?'Prépare-toi':st.big?'Repos entre les tours':'Repos'}</div><div class="restbig" id="rT">${fmt(st.secs)}</div><button class="btn sm" id="rAdd">+15 s</button></div>
      ${nx?`<div class="nextbox">${nx.id?`<div class="thumb" id="rNextFig"></div>`:''}<div><span class="mut small">À suivre</span><br><b>${nx.id?EX[nx.id].nom:'Étirement · '+nx.n}</b><br><span class="small dose">${nx.secs&&nx.id?nx.secs+' s':nx.reps?nx.reps[0]+(nx.reps[1]!==nx.reps[0]?'–'+nx.reps[1]:'')+' répétitions'+(nx.uni?' /côté':''):''}</span></div></div>`:''}
      <div class="ract"><button class="btn" id="rBack">‹</button><button class="btn pri" id="rSkip">Passer le repos</button></div>`;
    if(nx&&nx.id)$('#rNextFig').appendChild(mkFigure(nx.id).svg);
    $('#rAdd').onclick=()=>{R.end+=15000};
    timed(st.secs,$('#rT'),()=>{beep(1000,250);buzz(250);next()});
  }else if(st.k==='stretch'){
    body.innerHTML=`<div class="rfig" style="flex-direction:column;padding:20px;text-align:center"><div style="font-size:54px">🧘</div><p class="mut" style="max-width:340px">${st.t}</p></div>
      <div class="phase">Étirements · ${st.set} / ${st.of}</div><h2>${st.n}</h2><div class="target" id="rT">${fmt(st.secs)}<small> s</small></div>
      <div class="ract"><button class="btn" id="rBack">‹</button><button class="btn pri" id="rSkip">Suivant ›</button></div>`;
    timed(st.secs,$('#rT'),()=>{beep(1000,200);buzz(200);next()},' s');
  }else{
    const ex=EX[st.id];
    const tgt=st.secs?`<div class="target" id="rT">${fmt(st.secs)}<small> s</small></div>`:`<div class="target">${st.reps[0]}${st.reps[1]!==st.reps[0]?'–'+st.reps[1]:''}<small> répétitions${st.uni?' par côté':''}</small></div>`;
    run.style.setProperty('--rc',CATCOL[ex.cat]);
    body.innerHTML=`<div class="rfig" id="rFig"></div>
      <div class="phase">${st.ph} · ${st.lbl} ${st.set} / ${st.of}</div><h2>${ex.nom}</h2>${tgt}
      <div class="cue" id="rCue">${st.tempo&&!st.secs?'Tempo '+st.tempo.split(' ')[0]+' · ':''}${ex.consignes[0]}</div>
      <div class="ract"><button class="btn" id="rBack">‹</button><button class="btn pri" id="rSkip">${st.secs?'Passer ›':'✓ Terminé'}</button></div>`;
    const f=mkFigure(st.id);f.visible=true;$('#rFig').appendChild(f.svg);
    $('#rFig').onclick=()=>openEx(st.id);
    let ci=0;R.cue=setInterval(()=>{const c=$('#rCue');if(!c){clearInterval(R&&R.cue);return}ci=(ci+1)%ex.consignes.length;c.textContent=ex.consignes[ci]},4500);
    if(st.secs){beep(880,180);buzz(150);timed(st.secs,$('#rT'),()=>{beep(1000,300);buzz(300);next()},' s')}
  }
  $('#rSkip').onclick=next;
  $('#rBack').onclick=()=>{let j=R.i-1;while(j>0&&R.steps[j].k==='rest')j--;R.i=Math.max(0,j);clearInterval(R.cue);runStep()};
}
function next(){if(!R)return;clearInterval(R.cue);R.i++;runStep()}
function timed(secs,el,done,suf=''){
  R.end=Date.now()+secs*1000;let lastS=-1;
  R.timer=setInterval(()=>{
    if(!R)return;const left=(R.end-Date.now())/1000,s=Math.ceil(left);
    if(el.isConnected)el.innerHTML=fmt(left)+(suf?`<small>${suf}</small>`:'');
    if(s!==lastS){lastS=s;if(s<=3&&s>=1)beep(660,90)}
    if(left<=0){clearInterval(R.timer);done()}
  },200);
}

  ${bowl?`<circle cx="100" cy="75" r="64" fill="#c96f4a"/><circle cx="100" cy="75" r="56" fill="${r.img.c}"/><circle cx="100" cy="75" r="56" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="5"/>`
        :`<circle cx="100" cy="75" r="66" fill="#f1efe9"/><circle cx="100" cy="75" r="55" fill="none" stroke="#dcd8cf" stroke-width="2"/><circle cx="100" cy="75" r="44" fill="${r.img.c}" opacity=".55"/>`}
  ${e.map((x,i)=>`<text x="${P[i][0]}" y="${P[i][1]+P[i][2]*.36}" font-size="${P[i][2]}" text-anchor="middle">${x}</text>`).join('')}
  <path d="M184 30v90M178 30v18q6 8 12 0V30" stroke="#9aa3b2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/></svg>`;
}
function needs(){
  const b=profile?bilan(profile):null,kcal=b?b.kcal:2000,D=DIETS[NUT.diet];
  let P=b?Math.max(b.prot,Math.min(kcal*D.m[0]/400,profile.poids*2.2)):kcal*D.m[0]/400,G,Lp;
  if(NUT.diet==='keto'){G=Math.min(30,kcal*.05/4);Lp=(kcal-4*P-4*G)/9}
  else{const rem=kcal-4*P;G=rem*(D.m[1]/(D.m[1]+D.m[2]))/4;Lp=rem*(D.m[2]/(D.m[1]+D.m[2]))/9}
  return{kcal,P:Math.round(P),G:Math.round(G),L:Math.round(Lp),hasP:!!b};
}
function recFor(diet,meal){return RECETTES.filter(r=>r.d.includes(diet)&&r.m.includes(meal))}
function dayMenu(){
  const used=new Set(),menu={};let i=NUT.seed;
  for(const m of ['pdj','dej','col','din']){
    const l=recFor(NUT.diet,m).filter(r=>!used.has(r.id));
    const r=l.length?l[(i++*7+m.length)%l.length]:null;if(r)used.add(r.id);menu[m]=r;
  }
  return menu;
}
function renderNutri(){
  if(!NUT.diet)NUT.diet=profile?goalDiets(profile)[0]:'equilibre';
  const t=$('#t-nutri'),D=DIETS[NUT.diet],nd=needs(),reco=profile?goalDiets(profile):[];
  let h=`<div class="chips">${Object.entries(DIETS).map(([k,v])=>`<button class="${NUT.diet===k?'on':''}" data-diet="${k}">${v.ic} ${v.n}${reco[0]===k?' ★':''}</button>`).join('')}</div>
  <div class="seg" style="margin-bottom:14px">${[['plan','Mon plan'],['rec','Recettes'],['prod','Pas cher']].map(([k,l])=>`<button class="${NUT.sub===k?'on':''}" data-sub="${k}">${l}</button>`).join('')}</div>`;
  if(NUT.sub==='plan'){
    const menu=dayMenu(),tot=Object.values(menu).reduce((s,r)=>s+(r?r.k:0),0),f=tot?nd.kcal/tot:1,cost=Object.values(menu).reduce((s,r)=>s+(r?r.c:0),0);
    const pc=x=>Math.round(x/nd.kcal*100);
    h+=`<div class="card"><h2>${D.ic} Régime ${D.n}${reco.includes(NUT.diet)?' <span class="pill acc" style="vertical-align:middle">Conseillé pour ton objectif</span>':''}</h2>
      <p class="small mut" style="margin:0 0 10px">${D.d}</p>
      <div class="stats"><div class="stat"><b>${nd.kcal} kcal</b><span>par jour${nd.hasP?'':' (valeur par défaut)'}</span></div><div class="stat"><b>${eur(cost*Math.min(1.8,Math.max(.6,f)))}</b><span>Coût estimé de la journée type</span></div></div>
      ${[['Protéines',nd.P,4,'var(--acc)'],['Glucides',nd.G,4,'var(--blue)'],['Lipides',nd.L,9,'var(--acc2)']].map(([n,gr,k,c])=>`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between" class="small"><b>${n}</b><span class="mut">${gr} g · ${pc(gr*k)} %</span></div><div style="height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:4px"><i style="display:block;height:100%;width:${pc(gr*k)}%;background:${c}"></i></div></div>`).join('')}
      ${nd.hasP?'':'<p class="small mut" style="margin:10px 0 0">Remplis ton profil pour un calcul personnalisé.</p>'}
    </div>
    <div class="card"><div class="sess-h"><h2 style="margin:0">Ma journée type</h2><button class="btn sm" id="shuffle">🔀 Autre idée</button></div>
      <p class="small mut" style="margin:0 0 4px">${f>1.08||f<.92?`Ajuste les portions <b style="color:var(--txt)">×${f.toFixed(2).replace('.',',')}</b> pour atteindre ${nd.kcal} kcal (${tot} kcal à portion normale).`:`≈ ${tot} kcal, pile dans ta cible.`}</p>
      ${['pdj','dej','col','din'].map(m=>{const r=menu[m];if(!r)return'';return`<div class="exi" data-rec="${r.id}"><div class="thumb" style="width:76px">${plateSVG(r)}</div><div class="t"><span class="small" style="color:var(--acc);font-weight:700">${MEALS[m]} · ${Math.round(nd.kcal*MSPLIT[m])} kcal visées</span><b>${r.n}</b><span>${Math.round(r.k*f)} kcal · ${Math.round(r.p*f)} g prot. · ${eur(r.c*f)}</span></div><span class="mut">›</span></div>`}).join('')}
    </div>
    <div class="card"><h2>À privilégier / à limiter</h2>
      <ul class="small" style="padding-left:18px;margin:0 0 8px">${D.plus.map(x=>`<li>✅ ${x}</li>`).join('')}</ul>
      <ul class="small" style="padding-left:18px;margin:0">${D.moins.map(x=>`<li>⛔ ${x}</li>`).join('')}</ul>
      ${D.att?`<div class="warn">⚠️ ${D.att}</div>`:''}</div>
    <div class="card"><h2>Autour de l'entraînement</h2><ul class="small" style="padding-left:18px;margin:0">
      <li><b>1 à 2 h avant :</b> un repas léger avec glucides + un peu de protéines (ex. fromage blanc + banane${NUT.diet==='keto'?' ; en cétogène : œufs ou amandes':''}).</li>
      <li><b>Après la séance :</b> 20 à 40 g de protéines dans les 2 h, avec des glucides pour recharger.</li>
      <li><b>Hydratation :</b> 0,5 L dans l'heure qui précède, puis bois par petites gorgées pendant la séance.</li>
      ${profile&&goalsOf(profile).includes('perte')?'<li><b>Perte de poids :</b> vise −0,5 à −1 % de ton poids par semaine, pas plus, pour garder ton muscle.</li>':''}
      ${profile&&goalsOf(profile).some(STRENGTH)?'<li><b>Prise de muscle :</b> vise +0,25 à +0,5 % de ton poids par mois. Si la balance ne bouge pas, ajoute 150 à 200 kcal par jour.</li>':''}
    </ul></div>`;
  }else if(NUT.sub==='rec'){
    let list=RECETTES.filter(r=>r.d.includes(NUT.diet)&&(NUT.meal==='all'||r.m.includes(NUT.meal))&&(!NUT.budget||r.c<=1.5));
    h+=`<div class="chips">${[['all','Tous les repas'],...Object.entries(MEALS)].map(([k,l])=>`<button class="${NUT.meal===k?'on':''}" data-meal="${k}">${l}</button>`).join('')}</div>
    <label class="chk" style="margin:0 0 12px"><input type="checkbox" id="budg" ${NUT.budget?'checked':''}><span>💰 Petit budget uniquement (≤ 1,50 € la portion)</span></label>
    <div class="grid">${list.map(r=>`<button class="excard" data-rec="${r.id}"><div class="fbox" style="aspect-ratio:4/3">${plateSVG(r)}</div><div class="in"><b>${r.n}</b><span class="small mut">${r.k} kcal · ${r.p} g prot.</span><br><span class="small" style="color:var(--acc);font-weight:700">${eur(r.c)}</span><span class="small mut"> · ${r.t} min</span></div></button>`).join('')||'<p class="mut">Aucune recette avec ces filtres.</p>'}</div>`;
  }else{
    const cats={prot:'Protéines',fec:'Féculents',fl:'Fruits & légumes',autre:'Autres'};
    let list=PRODUITS.filter(p=>!NUT.compat||!p.x.includes(NUT.diet));
    h+=`<div class="card"><h2>💰 Bien manger sans se ruiner</h2><ul class="small" style="padding-left:18px;margin:0">${BUDGET_TIPS.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <label class="chk" style="margin:0 0 12px"><input type="checkbox" id="compat" ${NUT.compat?'checked':''}><span>Seulement les produits compatibles avec le régime ${D.n}</span></label>`;
    for(const [c,l] of Object.entries(cats)){
      const items=list.filter(p=>p.cat===c).sort((a,b)=>c==='prot'?(b.p*10/b.kg)-(a.p*10/a.kg):a.kg-b.kg);
      if(!items.length)continue;
      h+=`<div class="card"><h2>${l}</h2>${c==='prot'?'<p class="small mut" style="margin:-4px 0 6px">Classés du meilleur au moins bon rapport protéines / prix.</p>':''}${items.map(p=>`<div class="hist" style="align-items:flex-start"><span style="font-size:26px;line-height:1">${p.e}</span><div style="flex:1"><b>${p.n}</b> <span class="mut small">${p.px}</span><br><span class="small mut">${p.a}</span></div>${p.p>=5?`<span class="pill acc" style="white-space:nowrap">${Math.round(p.p*10/p.kg)} g prot./€</span>`:''}</div>`).join('')}</div>`;
    }
    h+=`<p class="small mut">Prix indicatifs en supermarché (marques distributeur, 2026). Ils varient selon le magasin et la saison.</p>`;
  }
  const cart=store.get('fc_cart',[]);
  if(cart.length)h+=`<div class="card"><div class="sess-h"><h2 style="margin:0">🛒 Ma liste de courses</h2><button class="btn sm" id="clrCart">Vider</button></div>${cart.map((c,i)=>`<label class="chk" style="margin-top:8px"><input type="checkbox" data-cart="${i}" ${c.ok?'checked':''}><span style="${c.ok?'text-decoration:line-through;color:var(--mut)':''}">${c.t}</span></label>`).join('')}</div>`;
  t.innerHTML=h;
  t.querySelectorAll('[data-diet]').forEach(b=>b.onclick=()=>{NUT.diet=b.dataset.diet;NUT.seed=0;saveNut();renderNutri()});
  t.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{NUT.sub=b.dataset.sub;saveNut();renderNutri()});
  t.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{NUT.meal=b.dataset.meal;saveNut();renderNutri()});
  t.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>openRec(b.dataset.rec));
  t.querySelectorAll('[data-cart]').forEach(b=>b.onchange=()=>{const c=store.get('fc_cart',[]);c[+b.dataset.cart].ok=b.checked;store.set('fc_cart',c);renderNutri()});
  const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  on('shuffle',()=>{NUT.seed++;saveNut();renderNutri()});
  on('clrCart',()=>{store.set('fc_cart',[]);renderNutri()});
  const bg=$('#budg');if(bg)bg.onchange=()=>{NUT.budget=bg.checked;saveNut();renderNutri()};
  const cp=$('#compat');if(cp)cp.onchange=()=>{NUT.compat=cp.checked;saveNut();renderNutri()};
}
function qtyTxt(q,u,n,sv){
  if(q==null)return n;
  const v=q*sv,s=v===.5?'½':Number.isInteger(v)?String(v):String(Math.round(v*10)/10).replace('.',',');
  return`${s}${u?(u==='g'||u==='ml'?' '+u:' '+u):''} ${n}`;
}
function openRec(id,sv){
  const r=RX[id],s=$('#sheet');sv=sv||NUT.serv||1;
  s.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h2>${r.n}</h2><button class="x" id="mClose" aria-label="Fermer">✕</button></div>
    <div style="border-radius:16px;overflow:hidden;margin:10px 0">${plateSVG(r)}</div>
    <div>${r.d.map(d=>`<span class="pill">${DIETS[d].ic} ${DIETS[d].n}</span>`).join('')}${r.m.map(m=>`<span class="pill">${MEALS[m]}</span>`).join('')}</div>
    <div class="stats" style="grid-template-columns:repeat(4,1fr);margin:8px 0 12px">
      <div class="stat"><b style="font-size:17px">${r.k}</b><span>kcal</span></div><div class="stat"><b style="font-size:17px">${r.p} g</b><span>protéines</span></div>
      <div class="stat"><b style="font-size:17px">${r.g} g</b><span>glucides</span></div><div class="stat"><b style="font-size:17px">${r.l} g</b><span>lipides</span></div></div>
    <p class="small" style="margin:0 0 10px">💰 <b>${eur(r.c)}</b> <span class="mut">par portion</span> · ⏱️ <b>${r.t} min</b></p>
    <div class="sess-h" style="align-items:center"><h3>Ingrédients</h3><div class="seg" style="width:auto">${[1,2,4].map(n=>`<button class="${sv===n?'on':''}" data-sv="${n}" style="padding:6px 10px;white-space:nowrap">${n} pers.</button>`).join('')}</div></div>
    <ul class="small">${r.i.map(x=>`<li>${qtyTxt(x[0],x[1],x[2],sv)}</li>`).join('')}</ul>
    <h3>Préparation</h3><ol class="small" style="padding-left:20px;margin:6px 0 12px">${r.s.map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="small mut">Valeurs pour 1 portion. Le coût est une estimation à partir de produits de marque distributeur.</p>
    <button class="btn pri full" id="addCart">🛒 Ajouter à ma liste de courses</button>`;
  $('#mClose').onclick=closeModal;
  s.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{NUT.serv=+b.dataset.sv;saveNut();openRec(id,NUT.serv)});
  $('#addCart').onclick=()=>{const c=store.get('fc_cart',[]);r.i.forEach(x=>{const tx=qtyTxt(x[0],x[1],x[2],sv);if(!c.some(y=>y.t===tx))c.push({t:tx,ok:false})});store.set('fc_cart',c);$('#addCart').textContent='✓ Ajouté à la liste';renderNutri()};
  $('#modal').classList.add('on');s.scrollTop=0;
}

loadForm();renderBilan();renderProg();renderLib();renderNutri();
if(profile)show('prog');
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
